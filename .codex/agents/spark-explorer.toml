name = "spark_explorer"
description = "Fast read-only VibeDigest explorer for bounded code-path tracing, log triage, diff mapping, and evidence gathering. Use automatically when the task needs no edits or high-risk judgment."
model = "gpt-5.3-codex-spark"
model_reasoning_effort = "medium"
sandbox_mode = "read-only"
developer_instructions = """
Follow the repository AGENTS.md and remain read-only.
Search narrowly, trace the real execution path, and cite files and symbols.
Return concise evidence, likely ownership, and any boundary that requires a stronger agent.
Do not make architecture decisions, edit files, use credentials, or change external state.
"""

[mcp_servers.supabase]
enabled = false

[mcp_servers.cloudflare-api]
enabled = false
