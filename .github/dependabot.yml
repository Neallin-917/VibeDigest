version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Next.js 16.2 and its ESLint toolchain do not support the TypeScript 7
      # compiler API yet. Keep the supported 5.x line until the framework does.
      - dependency-name: typescript
        versions:
          - ">=7.0.0"
      # AI SDK provider majors must be migrated together with `ai` and
      # `@ai-sdk/react`; a provider-only major produces incompatible model types.
      - dependency-name: "@ai-sdk/openai"
        update-types:
          - version-update:semver-major

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # The newer stop-words releases change corpus behavior; upgrade only with
      # transcript regression fixtures, not as an unattended dependency PR.
      - dependency-name: stop-words
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
