name: Codex CI Failure Triage

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed CI workflow run ID
        required: true
        type: string

permissions: {}

concurrency:
  group: codex-ci-triage-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: true

jobs:
  triage:
    if: >-
      vars.CODEX_CI_ENABLED == 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      final-message: ${{ steps.codex.outputs.final-message }}
    env:
      FAILED_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - name: Resolve the failed revision
        id: failed-run
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$EVENT_SHA" ]; then
            failed_sha="$EVENT_SHA"
          else
            failed_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}" --jq .head_sha)"
          fi
          test -n "$failed_sha"
          echo "sha=$failed_sha" >> "$GITHUB_OUTPUT"

      - name: Check out the failed revision
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.failed-run.outputs.sha }}
          persist-credentials: false

      - name: Collect failed step logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .codex-ci
          gh run view "$FAILED_RUN_ID" --log-failed > .codex-ci/failed.log
          test -s .codex-ci/failed.log

      - name: Diagnose the CI failure with Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          prompt: |
            Diagnose the failed VibeDigest CI run.

            Read `.codex-ci/failed.log`, inspect only the checked-out repository,
            and report:
            1. the most likely root cause;
            2. the smallest safe fix;
            3. the exact local verification commands;
            4. any uncertainty or missing evidence.

            Do not modify files, access external services, create commits, or
            claim a fix has passed when the log does not prove it.

  report:
    needs: triage
    if: needs.triage.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Publish the Codex diagnosis
        env:
          CODEX_REPORT: ${{ needs.triage.outputs.final-message }}
        run: |
          {
            echo "## Codex CI failure diagnosis"
            echo
            printf '%s\n' "$CODEX_REPORT"
          } >> "$GITHUB_STEP_SUMMARY"
