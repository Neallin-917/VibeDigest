name: Daily Ops Report

on:
  # 已禁用自动触发：改由 OpenClaw devops-automator agent 每天 09:00 (CST) 执行
  # schedule:
  #   - cron: '0 1 * * *'
  # 保留手动触发，方便测试
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.6"

jobs:
  send-daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run daily report
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FEISHU_WEBHOOK_URL:   ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: uv run python scripts/daily_report.py
