name: LLM Live Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llm-live-validation
  cancel-in-progress: false

jobs:
  provider-contract:
    name: OpenRouter Provider Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: llm-live
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r backend/requirements-dev.txt

      - name: Require the environment-scoped provider secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: test -n "$OPENROUTER_API_KEY"

      - name: Run the explicit live-provider contract
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: make test-llm-live
