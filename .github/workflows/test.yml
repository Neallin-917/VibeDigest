name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v7
    - name: Set up uv
      uses: astral-sh/setup-uv@v9.0.0
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - name: Restore uv cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('requirements.txt', 'backend/requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-uv-
    - name: Install dependencies
      run: |
        uv pip install --system -r requirements.txt -r backend/requirements-dev.txt

    - name: Run Linting
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        ruff check backend --select=E9,F63,F7,F82 --target-version=py310
        # Exit with zero even if there are errors, to treat as warnings for now
        ruff check backend --exit-zero

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    - name: Run tests
      env:
        SUPABASE_URL: "https://example.supabase.co"
        SUPABASE_SERVICE_KEY: "dummy-key"
        SUPABASE_JWT_SECRET: "dummy-jwt-secret-for-ci"
        OPENAI_API_KEY: "dummy-key"
        RESEND_API_KEY: "dummy-key"
        DATABASE_URL: "postgresql://postgres:test@localhost:5432/postgres"
        TEST_DATABASE_URL: "postgresql://postgres:test@localhost:5432/postgres"
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/backend
        uv run pytest -c backend/pytest.ini backend -m "not integration and not slow" 2>&1 | tee test-output.log

  backend-integration:
    name: Backend Integration Tests (OpenRouter)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v7
    - name: Set up uv
      uses: astral-sh/setup-uv@v9.0.0
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - name: Restore uv cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('requirements.txt', 'backend/requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-uv-
    - name: Install dependencies
      run: |
        uv pip install --system -r requirements.txt -r backend/requirements-dev.txt
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    - name: Run integration tests
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        # Use proven models for CI; YAML defaults may list aspirational future models.
        MODEL_ALIAS_SMART: openai/gpt-4o-mini
        MODEL_ALIAS_FAST: openai/gpt-4o-mini
        DATABASE_URL: "postgresql://postgres:test@localhost:5432/postgres"
        TEST_DATABASE_URL: "postgresql://postgres:test@localhost:5432/postgres"
        SUPABASE_URL: "https://example.supabase.co"
        SUPABASE_SERVICE_KEY: "dummy-key"
        SUPABASE_JWT_SECRET: "dummy-jwt-secret-for-ci"
        OPENAI_API_KEY: "dummy-key"
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/backend
        uv run pytest -c backend/pytest.ini backend/tests/ -m integration --no-cov -v

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v7
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Run Build Check
      run: npm run build
    - name: Run tests
      run: npm run test -- --run

  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v7
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run E2E tests
      run: npx playwright test
      env:
        NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-key"
        NEXT_PUBLIC_E2E_MOCK: "1"
