[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: exercises multiple local components without paid external APIs - excluded from default unit run
    llm_live: calls a real text-model provider and may incur cost - always opt-in
    eval: runs nondeterministic model-quality evaluations and may incur cost - always opt-in
    network: requires external network access - skipped in CI unless explicitly enabled
    slow: takes more than 5s - excluded from default run
addopts = --cov=. --cov-report=term-missing --cov-report=html --cov-fail-under=65 -m "not integration and not llm_live and not eval and not network and not slow"
