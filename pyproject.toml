[project]
name = "vibedigest"
version = "3.4.0"
description = "Cloud video transcription and AI knowledge platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "coinbase-commerce>=1.0.1,<2",
  "fastapi>=0.140.13,<0.142",
  "httpx>=0.28,<0.29",
  "langchain-community>=0.3,<0.4",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-text-splitters>=0.3,<1",
  "langgraph>=1.2,<2",
  "langsmith>=0.4,<1",
  "litellm>=1.84,<2",
  "loguru>=0.7.2,<1",
  "mcp>=2,<3",
  "openai>=2.50,<3",
  "openai-codex>=0.144.4,<0.145",
  "pg8000>=1.31.5,<2",
  "psycopg2-binary>=2.9.12,<3",
  "pydantic>=2.13.4,<3",
  "pydub>=0.25.1,<1",
  "pyjwt[crypto]>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.32,<1",
  "resend>=2,<3",
  "sentry-sdk[fastapi]>=2,<3",
  "sqlalchemy>=2.0.51,<3",
  "stop-words==2018.7.23",
  "supabase>=2.31,<3",
  "uvicorn[standard]>=0.51,<0.53",
  "yt-dlp>=2025.12.8",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=7,<8",
  "requests>=2.32,<3",
  "ruff>=0.15,<1",
  "testcontainers[postgres]>=4.14,<5",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Keep the repository-wide gate explicit and stable across Ruff releases.
# Cloud-critical files receive a stricter rule set from Makefile/CI while the
# legacy modules are modernized incrementally.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["B017"]
