[pytest]
testpaths = backend/tests
pythonpath = backend
python_files = test_*.py
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: calls real external services - excluded from default run
    slow: takes more than 5s - excluded from default run
addopts = -m "not integration and not slow" --ignore=backend/tests/test_bilibili_apple_integration.py --ignore=backend/tests/test_api.py --ignore=backend/tests/test_guest_quota.py --ignore=backend/tests/test_integration.py
